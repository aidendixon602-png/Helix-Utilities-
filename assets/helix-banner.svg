<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Helix Utilities</title>
  <desc id="desc">An all-in-one Discord bot and dashboard for secure, well-run communities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1022"/>
      <stop offset="0.48" stop-color="#17113C"/>
      <stop offset="1" stop-color="#0B1630"/>
